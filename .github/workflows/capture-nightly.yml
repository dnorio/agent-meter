name: Capture nightly

# Full capture suite — fixtures + proxy-shaped + LIVE MITM (and CLI when secrets exist).
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

concurrency:
  group: capture-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - name: Capture e2e (fixture contracts)
        run: bash scripts/ci/capture-e2e.sh

      - name: Capture proxy e2e (+ proxy/mcp unit)
        run: bash scripts/ci/capture-proxy-e2e.sh

      - name: OTLP regression suite
        run: cargo test -p agent-meter-collector --test otlp_regression -- --test-threads=1

      - name: Capture LIVE e2e (MITM required)
        env:
          CAPTURE_LIVE_MODE: mitm
          CAPTURE_LIVE_REQUIRED: "1"
        run: bash scripts/ci/capture-live-e2e.sh

  capture-live-cli:
    # Optional: real CLIs when secrets configured. Soft-skip if missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - name: Capture LIVE CLI (when keys present)
        env:
          CAPTURE_LIVE_MODE: cli
          CAPTURE_LIVE_REQUIRED: "0"
          CAPTURE_LIVE_SKIP_CLI: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Install CLIs only when at least one provider key exists
          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${OPENAI_API_KEY:-}" ]; then
            curl -fsSL https://claude.ai/install.sh | bash || true
            npm install -g @openai/codex opencode-ai 2>/dev/null || true
          fi
          bash scripts/ci/capture-live-e2e.sh
