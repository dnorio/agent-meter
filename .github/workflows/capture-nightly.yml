name: Capture nightly

# Full capture suite — fixtures + proxy-shaped + LIVE MITM (and CLI when secrets exist).
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

concurrency:
  group: capture-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - name: Capture e2e (fixture contracts)
        run: bash scripts/ci/capture-e2e.sh

      - name: Capture proxy e2e (+ proxy/mcp unit)
        run: bash scripts/ci/capture-proxy-e2e.sh

      - name: Capture-record smoke
        run: bash scripts/ci/capture-record-smoke.sh

      - name: Matrix coverage alignment
        run: bash scripts/ci/capture-matrix-coverage.sh

      - name: OTLP regression suite
        run: cargo test -p agent-meter-collector --test otlp_regression -- --test-threads=1

      - name: Capture LIVE e2e (MITM required)
        env:
          CAPTURE_LIVE_MODE: mitm
          CAPTURE_LIVE_REQUIRED: "1"
          CAPTURE_LIVE_SUMMARY_OUT: ${{ runner.temp }}/capture-live-summary.json
        run: bash scripts/ci/capture-live-e2e.sh

      - name: Upload live summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-live-mitm-summary
          path: ${{ runner.temp }}/capture-live-summary.json
          if-no-files-found: ignore

  capture-live-cli:
    # Only spend runner minutes when at least one provider secret is configured.
    # Secrets-in-if is intentional here (same-repo schedule/dispatch).
    if: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.OPENAI_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Capture LIVE CLI (keys present → hard-fail those CLIs)
        env:
          CAPTURE_LIVE_MODE: cli
          CAPTURE_LIVE_REQUIRED: "0"
          CAPTURE_LIVE_SKIP_CLI: "0"
          CAPTURE_LIVE_SUMMARY_OUT: ${{ runner.temp }}/capture-live-cli-summary.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            curl -fsSL https://claude.ai/install.sh | bash || true
          fi
          if [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            npm install -g @openai/codex 2>/dev/null || true
            curl -fsSL https://opencode.ai/install 2>/dev/null | bash || npm install -g opencode-ai 2>/dev/null || true
          fi
          bash scripts/ci/capture-live-e2e.sh

      - name: Upload CLI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-live-cli-summary
          path: ${{ runner.temp }}/capture-live-cli-summary.json
          if-no-files-found: ignore
