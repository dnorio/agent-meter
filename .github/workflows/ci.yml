name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/ci/check-versions.sh
      - run: bash scripts/ci/install-scripts-check.sh
      - run: bash scripts/ci/smoke-demo.sh
      - run: bash scripts/ci/history-audit.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python3 -m pip install pytest httpx build twine
      - run: python3 -m pytest -q
        working-directory: sdk/python
      - run: python3 -m build
        working-directory: sdk/python
      - run: python3 -m twine check dist/*
        working-directory: sdk/python

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci
        working-directory: sdk/node
      - run: npm run build
        working-directory: sdk/node
      - run: npm test
        working-directory: sdk/node
      - run: npm pack --dry-run
        working-directory: sdk/node
      - run: bash scripts/ci/node-tarball-smoke.sh
      - run: bash scripts/ci/sdk-integration-smoke.sh

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build -t agent-meter:ci .

      - name: Health + check smoke
        run: |
          set -euo pipefail
          cid="$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v agent-meter-ci-data:/data \
            -p 8081:8081 -p 4318:4318 \
            agent-meter:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8081/health | grep -q '"status":"ok"'
          docker exec "$cid" agent-meter check
          curl -sf http://127.0.0.1:8081/badge/cost.svg | grep -q '<svg'
          curl -sf http://127.0.0.1:8081/badge/events.svg | grep -q '<svg'
          curl -sf http://127.0.0.1:8081/openapi.json | grep -q '"openapi":"3.1.0"'
          curl -sf http://127.0.0.1:8081/api/version | grep -q '"service":"agent-meter-collector"'

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_meter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_meter_test
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - run: cargo test -p agent-meter-db --test postgres_smoke
