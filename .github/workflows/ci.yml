name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test (standalone core)
        run: cargo test -p agent-meter-collector -p agent-meter-db

      - name: Build (release, full workspace)
        run: cargo build --workspace --release

  smoke:
    name: demo smoke test
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build collector
        run: cargo build -p agent-meter-collector

      - name: Seed demo + verify API
        run: |
          set -euo pipefail
          AGENT_METER_NO_OPEN=1 \
          DATABASE_URL="sqlite:///tmp/ci-demo.db" \
          AGENT_METER_PORT=8081 AGENT_METER_OTLP_PORT=4318 \
            ./target/debug/agent-meter-collector demo --conversations 3 --events 5 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/health >/dev/null; then break; fi
            sleep 1
          done
          n=$(curl -sf "http://127.0.0.1:8081/api/conversations?limit=10" | grep -o '"conversation_id"' | wc -l)
          echo "conversations seeded: $n"
          test "$n" -ge 3
          kill "$SERVER_PID" || true
