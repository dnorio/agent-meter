name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/ci/smoke-demo.sh
      - run: bash scripts/ci/history-audit.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python3 -m pip install pytest httpx build
      - run: python3 -m pytest -q
        working-directory: sdk/python
      - run: python3 -m build
        working-directory: sdk/python

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci
        working-directory: sdk/node
      - run: npm run build
        working-directory: sdk/node
      - run: npm test
        working-directory: sdk/node
      - run: npm pack --dry-run
        working-directory: sdk/node
      - run: bash scripts/ci/node-tarball-smoke.sh
