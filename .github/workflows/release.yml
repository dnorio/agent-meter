# Build and publish release artifacts when a version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - name: Install cross
        run: cargo install cross --locked

      - name: Build release artifacts
        run: USE_CROSS=1 INSTALL_MINGW=1 bash scripts/ci/release-build.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Smoke test artifacts
        run: bash scripts/ci/release-smoke.sh dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: agent-meter ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
