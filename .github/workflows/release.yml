# Build and publish release artifacts when a version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      - name: Install cross
        run: cargo install cross --locked

      - name: Install Windows cross toolchain
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mingw-w64 zip

      - name: Build release artifacts
        run: USE_CROSS=1 INSTALL_MINGW=1 bash scripts/ci/release-build.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Smoke test artifacts
        run: bash scripts/ci/release-smoke.sh dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: agent-meter ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  release-macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-macos
          cache-on-failure: true

      - name: Build macOS artifacts
        run: bash scripts/ci/release-build-macos.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Upload macOS artifacts to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/ci/release-upload-macos.sh "$RELEASE_TAG"

  publish-sdks:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish npm + PyPI SDKs
        continue-on-error: true
        env:
          NPM_TOKEN_3: ${{ secrets.NPM_TOKEN_3 }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: bash scripts/ci/publish-sdks.sh
