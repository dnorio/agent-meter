# SonarQube — agent-meter OSS (dnorio/agent-meter)
# Dashboard: https://sonar.ssdnodes.dnor.io/dashboard?id=agent-meter-oss

sonar.projectKey=agent-meter-oss
sonar.projectName=agent-meter-oss
sonar.sourceEncoding=UTF-8

sonar.sources=crates
sonar.exclusions=**/target/**,**/ui/**/*.html,**/migrations/**
# UI static assets + binary entrypoints + unused Postgres backend in SQLite OSS default
sonar.coverage.exclusions=**/ui/**,**/*.js,**/*.css,**/main.rs,**/bin/**,**/postgres.rs,**/demo.rs,**/telemetry.rs

sonar.tests=crates
sonar.test.inclusions=**/*_test.rs,**/tests/**

sonar.lang.patterns.rust=**/*.rs

# Official Sonar Rust LCOV (scripts/ci/coverage-sonar.sh → target/coverage/lcov.info)
sonar.rust.lcov.reportPaths=target/coverage/lcov.info
