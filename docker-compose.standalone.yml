# agent-meter OSS — Docker Compose (SQLite, build from source)
#
#   docker compose -f docker-compose.standalone.yml up -d --build
#   open http://localhost:8081

services:
  agent-meter:
    build: .
    image: agent-meter:local
    container_name: agent-meter
    ports:
      - "8081:8081"
      - "4318:4318"
    environment:
      DATABASE_URL: "sqlite:///data/agent-meter.db"
      AGENT_METER_HOST: "0.0.0.0"
      AGENT_METER_PORT: "8081"
      AGENT_METER_OTLP_PORT: "4318"
      RUST_LOG: "info"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - agent-meter-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "agent-meter", "check"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-meter-data:
