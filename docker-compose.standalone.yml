# agent-meter OSS — Docker Compose (SQLite, build from source)
#
#   docker compose -f docker-compose.standalone.yml up -d --build
#   open http://localhost:8081

services:
  agent-meter:
    build: .
    image: agent-meter:local
    container_name: agent-meter
    ports:
      - "8081:8081"
      - "4318:4318"
    environment:
      DATABASE_URL: "sqlite:///data/agent-meter.db"
      HOST: "0.0.0.0"
      PORT: "8081"
      OTLP_PORT: "4318"
      RUST_LOG: "info"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
